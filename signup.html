<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account</title>
<style>
body{margin:0;background:#f6f8fc;color:#17223b;font:16px system-ui}
.box{width:min(390px,calc(100% - 40px));margin:12vh auto;background:#fff;border:1px solid #dce2ed;border-radius:18px;padding:28px}
p{color:#68738a}
label{display:block;margin:15px 0 6px;font-weight:700;font-size:.9rem}
input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #bdc8dc;border-radius:8px;font:inherit}
button{width:100%;margin-top:22px;padding:11px;border:0;border-radius:9px;background:#375dfb;color:#fff;font:inherit;font-weight:700}
.flash{background:#fff0f4;color:#8a2344;padding:10px;border-radius:8px}
.link{text-align:center;margin-top:18px}
a{color:#375dfb}
</style>
</head>
<body>
<main class="box">
<h1>Create your account</h1>
<p>Your scan history stays linked to this account.</p>
{% for message in get_flashed_messages() %}
<div class="flash">{{ message }}</div>
{% endfor %}
<form method="post">
<label>Username</label>
<input name="username" required autocomplete="username">
<label>Password</label>
<input name="password" type="password" required minlength="8" autocomplete="new-password">
<button>Create account</button>
</form>
<p class="link">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
<p class="link"><a href="{{ url_for('home') }}">Back to home</a></p>
</main>
</body>
</html>
